AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  One-time setup. Creates the IAM role that GitHub Actions uses to deploy the
  Lucky resource plan, trusted through GitHub's OIDC provider (no access keys).

Parameters:
  GitHubOrg:
    Type: String
    Description: GitHub organisation or user that owns the repository (e.g. my-company)
  GitHubRepo:
    Type: String
    Description: Repository name (e.g. lucky-resource-plan)
  GitHubEnvironment:
    Type: String
    Default: production
    Description: GitHub environment the workflow deploys from (must match deploy.yml)
  AppStackName:
    Type: String
    Default: lucky-resource-plan
    AllowedPattern: '^[a-z][a-z0-9-]{2,40}$'
    Description: Stack name the workflow deploys (lower case; must match the STACK_NAME variable)
  CreateOIDCProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Choose false if this AWS account already has the token.actions.githubusercontent.com identity provider

Conditions:
  MakeProvider: !Equals [!Ref CreateOIDCProvider, 'true']

Resources:
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'github-deploy-${AppStackName}'
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeProvider
                - !Ref GitHubOIDCProvider
                - !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOrg}/${GitHubRepo}:environment:${GitHubEnvironment}'
      Policies:
        - PolicyName: deploy-lucky-resource-plan
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudFormationStacks
                Effect: Allow
                Action: 'cloudformation:*'
                Resource:
                  - !Sub 'arn:aws:cloudformation:*:${AWS::AccountId}:stack/${AppStackName}/*'
                  - !Sub 'arn:aws:cloudformation:*:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*'
              - Sid: CloudFormationGeneral
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStacks
                  - cloudformation:ValidateTemplate
                Resource: '*'
              - Sid: SamArtifactsAndSiteBuckets
                Effect: Allow
                Action: 's3:*'
                Resource:
                  - 'arn:aws:s3:::aws-sam-cli-managed-default-*'
                  - 'arn:aws:s3:::aws-sam-cli-managed-default-*/*'
                  - !Sub 'arn:aws:s3:::${AppStackName}-sitebucket-*'
                  - !Sub 'arn:aws:s3:::${AppStackName}-sitebucket-*/*'
              - Sid: LambdaFunction
                Effect: Allow
                Action: 'lambda:*'
                Resource: !Sub 'arn:aws:lambda:*:${AWS::AccountId}:function:${AppStackName}-*'
              - Sid: DynamoDBTable
                Effect: Allow
                Action:
                  - dynamodb:CreateTable
                  - dynamodb:DescribeTable
                  - dynamodb:UpdateTable
                  - dynamodb:DescribeContinuousBackups
                  - dynamodb:UpdateContinuousBackups
                  - dynamodb:DescribeTimeToLive
                  - dynamodb:TagResource
                  - dynamodb:UntagResource
                  - dynamodb:ListTagsOfResource
                Resource: !Sub 'arn:aws:dynamodb:*:${AWS::AccountId}:table/${AppStackName}-*'
              - Sid: ApiGateway
                Effect: Allow
                Action: 'apigateway:*'
                Resource: 'arn:aws:apigateway:*::/*'
              - Sid: CloudFront
                Effect: Allow
                Action: 'cloudfront:*'
                Resource: '*'
              - Sid: FunctionRole
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${AppStackName}-PlanFunctionRole-*'
              - Sid: FunctionRoleManagedPolicyOnlyLambdaBasic
                Effect: Allow
                Action: iam:AttachRolePolicy
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${AppStackName}-PlanFunctionRole-*'
                Condition:
                  ArnEquals:
                    iam:PolicyARN: 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'

Outputs:
  DeployRoleArn:
    Description: Put this in the GitHub secret AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
